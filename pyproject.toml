[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polybot"
version = "0.1.0"
description = "Risk-first paper trading system for Polymarket"
requires-python = ">=3.11"
dependencies = [
  "httpx[socks]>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "typer>=0.12,<1",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1", "ruff>=0.5,<1"]

[project.scripts]
polybot = "polybot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/polybot"]

[tool.hatch.build.targets.wheel.force-include]
"src/polybot/dashboard.html" = "polybot/dashboard.html"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
